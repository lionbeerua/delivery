<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<title>Lion Beer Адмінка</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A08;color-scheme:dark}
*{box-sizing:border-box}
button,input,textarea{font-family:'Montserrat',system-ui,sans-serif}
button{-webkit-tap-highlight-color:transparent;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background-color .25s,border-color .25s,color .25s}
button:active{transform:scale(.96);transition-duration:.12s}
.app{--gold:#F2C142;--line:rgba(255,245,225,.1);--tx:#F8F3E9;--mu:#B3AA97;--ink:#1B1403;position:relative;min-height:100vh;background:#0B0A08;color:var(--tx);font-family:'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:60px;overflow-x:hidden}
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4}
.o1{width:320px;height:320px;background:#F2C142;top:-100px;left:-100px;animation:d1 18s ease-in-out infinite alternate}
.o2{width:300px;height:300px;background:#E78531;bottom:0;right:-120px;opacity:.28;animation:d2 21s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(120px,140px)}}
@keyframes d2{to{transform:translate(-120px,-120px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.layer{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 14px}
.lg{position:relative;background:linear-gradient(140deg,rgba(255,255,255,.15),rgba(255,255,255,.04) 60%,rgba(255,255,255,.08));backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),0 12px 30px rgba(0,0,0,.35)}
.lg::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 12% -10%,rgba(255,255,255,.22),transparent 55%)}
.head{display:flex;align-items:center;justify-content:space-between;height:72px}
.head h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.04em}
.back{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:22px;color:var(--tx);text-decoration:none;font-weight:700;font-size:13px}
.tabs{display:flex;gap:6px;padding:5px;border-radius:26px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:max-content;height:44px;padding:0 16px;border-radius:21px;border:0;background:transparent;color:var(--mu);font-weight:700;font-size:14px;cursor:pointer}
.tab.on{background:var(--gold);color:var(--ink);box-shadow:0 6px 18px rgba(242,193,66,.3)}
.pane{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;margin-top:14px}
.note{margin:0 2px 12px;font-size:13px;line-height:1.5;color:var(--mu);font-weight:500}
.search{width:100%;height:52px;border-radius:26px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.3);color:var(--tx);padding:0 20px;font-size:16px;font-weight:500;outline:none;margin-bottom:12px}
.search:focus,.in:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,193,66,.18)}
.search::placeholder,.in::placeholder{color:#8f8672}
.cat{border-radius:26px;margin-bottom:10px;overflow:hidden}
.cat-h{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 8px;min-height:68px}
.cat-b{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--tx);text-align:left;cursor:pointer;padding:6px 4px;min-height:48px}
.cat-b:active{transform:none;opacity:.85}
.cat-n{font-weight:800;font-size:16px;letter-spacing:-.02em}
.cat-s{font-size:12px;color:var(--mu);margin-top:3px;font-weight:500}
.chev{flex:none;transition:transform .5s cubic-bezier(.34,1.56,.64,1);color:var(--mu)}
.cat.open .chev{transform:rotate(90deg)}
.cat-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.32,.72,0,1)}
.cat.open .cat-body{grid-template-rows:1fr}
.cat-in{overflow:hidden}
.plist{padding:0 8px 8px}
.row{display:flex;align-items:center;gap:12px;padding:8px 8px;border-top:1px solid rgba(255,255,255,.08);min-height:60px}
.row-t{flex:1;min-width:0}
.row-n{font-size:14px;font-weight:600;line-height:1.3}
.row-p{font-size:12px;color:var(--mu);margin-top:3px;font-weight:500}
.row-p b{color:var(--gold);font-weight:700}
.edit{flex:none;height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--tx);font-weight:700;font-size:13px;cursor:pointer}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.14);position:relative;cursor:pointer;margin:0;transition:background .3s;border:0;outline-offset:3px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.sw:checked{background:var(--gold)}
.sw:checked::after{transform:translateX(20px)}
.empty{padding:26px 8px;text-align:center;color:var(--mu);font-size:14px;line-height:1.5}

.scrim{position:fixed;inset:0;border:0;padding:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s;z-index:40;cursor:default}
.scrim.open{opacity:1;visibility:visible;transition:opacity .4s}
.scrim:active{transform:none}
.dr{position:fixed;left:50%;bottom:0;z-index:50;width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:34px 34px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(150deg,rgba(54,49,40,.92),rgba(20,18,14,.95));transform:translate(-50%,106%);visibility:hidden;transition:transform .65s cubic-bezier(.32,.72,0,1),visibility 0s .65s}
.dr.open{transform:translate(-50%,0);visibility:visible;transition:transform .65s cubic-bezier(.32,.72,0,1)}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 8px}
.dr-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.dr-h h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.03em;line-height:1.2}
.iconbtn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--tx);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fld label{font-size:13px;color:var(--mu);font-weight:500}
.fld .hint{font-size:12px;color:var(--mu);font-weight:500}
.in{width:100%;height:52px;border-radius:16px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.3);color:var(--tx);padding:0 16px;font-size:16px;font-weight:500;outline:none;transition:border-color .25s,box-shadow .25s}
textarea.in{height:108px;padding:14px 16px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#E4DCCB;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:800}
.drop{display:flex;align-items:center;justify-content:center;gap:10px;height:96px;border-radius:20px;border:1.5px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.04);color:var(--mu);font-weight:600;font-size:14px;cursor:pointer;width:100%}
.cta{width:100%;height:56px;border-radius:28px;border:0;background:var(--gold);color:var(--ink);font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 10px 26px rgba(242,193,66,.3);margin-top:18px}
.link{background:none;border:0;color:var(--gold);font-weight:700;font-size:13px;cursor:pointer;padding:0;height:36px;text-align:left}
.link:active{transform:none;opacity:.8}

.blk{border-radius:26px;padding:18px;margin-bottom:12px}
.blk h2{margin:0 0 12px;font-size:16px;font-weight:800;letter-spacing:-.02em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{border-radius:22px;padding:16px}
.tile span{font-size:12px;color:var(--mu);font-weight:500}
.tile b{display:block;margin-top:8px;font-size:30px;font-weight:900;letter-spacing:-.04em;color:#6f675a}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.bars i{flex:1;border-radius:8px 8px 4px 4px;border:1.5px dashed rgba(255,255,255,.22);background:rgba(255,255,255,.04)}
.ord{border-radius:26px;padding:18px;margin-bottom:12px}
.ord-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{height:30px;padding:0 13px;border-radius:15px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;background:rgba(255,255,255,.12)}
.badge.new{background:var(--gold);color:var(--ink)}
.badge.acc{background:#7CB8FF;color:#07203B}
.badge.done{background:#7CE08A;color:#06260E}
.badge.cancel{background:#FF9B8F;color:#3A0A04}
.sample{font-size:12px;color:var(--mu);font-weight:600}
.ln{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0;line-height:1.35}
.ln span:first-child{color:var(--mu);font-weight:500}
.ln span:last-child{font-weight:700;text-align:right}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.act{height:48px;border-radius:24px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:var(--tx);font-weight:700;font-size:13px;cursor:pointer;padding:0 6px}
.act.p{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.tg{display:flex;align-items:center;gap:14px;padding:6px 0}
.tg-t{flex:1;font-size:14px;font-weight:600;line-height:1.35}
.tg-t small{display:block;margin-top:3px;font-size:12px;color:var(--mu);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,160%);z-index:70;height:52px;padding:0 24px;border-radius:26px;display:flex;align-items:center;font-weight:700;font-size:14px;transition:transform .6s cubic-bezier(.34,1.5,.5,1);white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.mbox{border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:6px 14px 14px;margin-top:10px;background:rgba(255,255,255,.04)}
.mrow{display:flex;justify-content:space-between;align-items:center;min-height:50px}
.mname{font-weight:800;font-size:15px}
.mfields{display:grid;gap:12px}
.lv5{display:flex;gap:6px}
.lvb{flex:1;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#E4DCCB;font-weight:700;font-size:15px;cursor:pointer;padding:0}
.lvb.on{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:800}
.pv{display:flex;gap:5px;margin-top:10px}
.pv i{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.14);transition:background .3s}
.pv i.on{background:var(--gold)}
@media (hover:hover){.edit:hover,.chip:hover:not(.on),.act:hover,.iconbtn:hover{border-color:rgba(255,255,255,.4)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}


.sync{margin:0 0 14px}
.syncb{width:100%;height:52px;border-radius:26px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.syncb:disabled{opacity:.6;cursor:wait}
.syncb svg.spin{animation:spinr .9s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.syncmsg{margin:10px 2px 0;font-size:13px;line-height:1.5;color:var(--tx);font-weight:500}
.newtag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:10px;background:var(--gold);color:var(--ink);font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle}
/* простий чорний інтерфейс без скла */
.orbs{display:none}
.app{background:#000}
body{background:#000}
.lg{background:#141414;backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid #2a2a2a;box-shadow:none}
.lg::before{display:none}
.scrim{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(0,0,0,.7)}
.dr{background:#0f0f0f;backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid #2a2a2a;border-bottom:0}
.bprev{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-bottom:10px;border:1px solid #2a2a2a}
.savebar{position:fixed;left:12px;right:12px;bottom:14px;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 18px;border-radius:18px;background:#1b1b1b;border:1px solid #f2c142;box-shadow:0 10px 30px rgba(0,0,0,.6);color:#fff;font-weight:600;font-size:15px;max-width:640px;margin:0 auto}
.savebar button{height:46px;padding:0 20px;border:0;border-radius:13px;background:#f2c142;color:#1b1403;font-weight:800;font-size:16px;cursor:pointer}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">


<div class="app">
<div class="orbs" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div></div>
<div class="layer">

<header class="head">
<h1>Адмінка</h1>
<a class="back lg" href="lion-beer-delivery.html">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
На сайт
</a>
</header>

<nav class="tabs lg" aria-label="Розділи адмінки">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button class="tab {{t.cls}}" onClick="{{t.pick}}" aria-pressed="{{t.active}}">{{t.label}}</button>
</sc-for>
</nav>

<sc-if value="{{isProducts}}" hint-placeholder-val="{{ true }}">
<section class="pane">
<p class="note">Товари тягнуться з Poster. Вмикайте категорії та окремі товари, які мають бути на сайті. Для кожного можна змінити назву, ціну й опис, не чіпаючи Poster.</p>
<div class="sync">
<button class="syncb" onClick="{{sync}}" disabled="{{syncing}}"><svg class="{{syncCls}}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 20v-4h-4"/></svg>{{syncLabel}}</button>
<sc-if value="{{hasSyncMsg}}" hint-placeholder-val="{{ false }}"><p class="syncmsg">{{syncMsg}}</p></sc-if>
</div>
<input class="search" type="search" placeholder="Пошук товару" aria-label="Пошук товару" value="{{q}}" onInput="{{onQ}}">

<sc-if value="{{hasSearch}}" hint-placeholder-val="{{ false }}">
<div class="cat lg open">
<div class="plist">
<sc-for list="{{found}}" as="p" hint-placeholder-count="3">
<div class="row">
<input class="sw" type="checkbox" checked="{{p.on}}" onChange="{{p.toggle}}" aria-label="Показувати на сайті">
<div class="row-t"><div class="row-n">{{p.name}}<sc-if value="{{p.isNew}}" hint-placeholder-val="{{ false }}"><span class="newtag">Новий</span></sc-if></div><div class="row-p">{{p.priceText}}</div></div>
<button class="edit" onClick="{{p.edit}}">Змінити</button>
</div>
</sc-for>
<sc-if value="{{noFound}}" hint-placeholder-val="{{ false }}"><div class="empty">Нічого не знайдено</div></sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{noSearch}}" hint-placeholder-val="{{ true }}">
<div>
<sc-if value="{{hasNew}}" hint-placeholder-val="{{ false }}">
<div class="cat lg open">
<div class="cat-h"><div class="cat-b" style="cursor:default"><span><div class="cat-n">Нові з Poster</div><div class="cat-s">Вимкнені. Увімкніть ті, що мають бути на сайті</div></span></div></div>
<div class="plist">
<sc-for list="{{newItems}}" as="p" hint-placeholder-count="2">
<div class="row">
<input class="sw" type="checkbox" checked="{{p.on}}" onChange="{{p.toggle}}" aria-label="Показувати на сайті">
<div class="row-t"><div class="row-n">{{p.name}}<span class="newtag">Новий</span></div><div class="row-p">{{p.priceText}}</div></div>
<button class="edit" onClick="{{p.edit}}">Змінити</button>
</div>
</sc-for>
</div>
</div>
</sc-if>
<sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
<div>
<sc-if value="{{c.groupTitle}}" hint-placeholder-val="{{ false }}"><div class="note" style="margin:18px 4px 8px;font-weight:700;color:var(--tx)">Снеки Вагові <span style="font-weight:500;color:var(--mu)">· групи з Poster</span></div></sc-if>
<div class="cat lg {{c.cls}}">
<div class="cat-h">
<button class="cat-b" onClick="{{c.expand}}" aria-expanded="{{c.isOpen}}">
<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
<span><div class="cat-n">{{c.name}}</div><div class="cat-s">{{c.status}}</div></span>
</button>
<input class="sw" type="checkbox" checked="{{c.all}}" onChange="{{c.toggle}}" aria-label="Показувати всю категорію на сайті">
</div>
<div class="cat-body"><div class="cat-in">
<sc-if value="{{c.hasLabel}}" hint-placeholder-val="{{ false }}"><div class="fld" style="margin:0 0 12px"><label>Назва кнопки-фільтра на сайті</label><input class="in" type="text" value="{{c.label}}" onInput="{{c.onLabel}}"><span class="hint">У Poster: «{{c.name}}». На сайті буде це коротке слово.</span></div></sc-if>
<div class="plist">
<sc-for list="{{c.items}}" as="p" hint-placeholder-count="2">
<div class="row">
<input class="sw" type="checkbox" checked="{{p.on}}" onChange="{{p.toggle}}" aria-label="Показувати на сайті">
<div class="row-t"><div class="row-n">{{p.name}}<sc-if value="{{p.isNew}}" hint-placeholder-val="{{ false }}"><span class="newtag">Новий</span></sc-if></div><div class="row-p">{{p.priceText}}</div></div>
<button class="edit" onClick="{{p.edit}}">Змінити</button>
</div>
</sc-for>
</div></div></div>
</div>
</div>
</sc-for>
</div>
</sc-if>
</section>
</sc-if>

<sc-if value="{{isBanners}}" hint-placeholder-val="{{ false }}">
<section class="pane">
<p class="note">Це карусель на головній сторінці сайту. Додавайте новинки й акції: фото, заголовок і короткий текст. Банери міняються по черзі, перший банер завжди залишається, його текст теж можна змінити.</p>
<sc-for list="{{banners}}" as="b" hint-placeholder-count="2">
<div class="blk lg">
<div class="ord-top"><span class="badge new">Банер {{b.n}}</span><input class="sw" type="checkbox" checked="{{b.on}}" onChange="{{b.toggle}}" aria-label="Показувати на сайті"></div>
<div class="chips" style="margin-top:14px">
<sc-for list="{{b.kinds}}" as="k" hint-placeholder-count="3"><button class="chip {{k.cls}}" onClick="{{k.pick}}" aria-pressed="{{k.active}}">{{k.label}}</button></sc-for>
</div>
<div class="fld"><label for="bt{{b.n}}">Заголовок</label><input id="bt{{b.n}}" class="in" type="text" placeholder="Коротко й ясно" value="{{b.title}}" onInput="{{b.onTitle}}"></div>
<div class="fld"><label for="bs{{b.n}}">Короткий текст</label><input id="bs{{b.n}}" class="in" type="text" placeholder="Терміни, умови" value="{{b.sub}}" onInput="{{b.onSub}}"></div>

  async uploadPhoto(file) {
    if (!file) return;
    this.setState({ photoBusy: true });
    try {
      const bmp = await createImageBitmap(file);
      const sc = Math.min(1, 900 / bmp.width, 1200 / bmp.height);
      const w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, w, h); g.drawImage(bmp, 0, 0, w, h);
      const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.88));
      const r = await fetch('/api/admin/upload', { method: 'POST', body: blob, credentials: 'same-origin' });
      if (!r.ok) throw new Error('upload');
      const { url } = await r.json();
      const id = this.state.editId;
      const draft = { ...this.state.draft, img: url };
      this.setState({ draft, edits: { ...this.state.edits, [id]: { ...draft, upre: this.presetToSave() } }, photoBusy: false });
      this.saveAll();
    } catch (e) {
      this.setState({ photoBusy: false });
      this._toast && this._toast('Не вдалося завантажити фото');
    }
  }

  async uploadImage(i, file) {
    if (!file) return;
    try {
      const bmp = await createImageBitmap(file);
      const w = Math.min(1080, bmp.width), h = Math.round(bmp.height * w / bmp.width);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(bmp, 0, 0, w, h);
      const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.86));
      const r = await fetch('/api/admin/upload', { method: 'POST', body: blob, credentials: 'same-origin' });
      if (!r.ok) throw new Error('upload');
      const { url } = await r.json();
      this.upB(i, { img: url });
      this._toast && this._toast('Фото завантажено. Натисніть «Зберегти»');
    } catch (e) {
      this._toast && this._toast('Не вдалося завантажити фото');
    }
  }

    bars = bars.map((b) => ({ tip: b.tip + ': ' + b.v, st: 'height:' + Math.max(b.v ? 8 : 3, Math.round((b.v / mx) * 100)) + '%;border:none;background:' + (b.v ? 'var(--gold)' : 'rgba(255,255,255,.12)') }));
    const barsTitle = s.period === 'day' ? 'Замовлення по годинах' : 'Замовлення за днями';
    const barsNote = okO.length ? 'Найвищий стовпчик: ' + mx + ' зам.' : 'Дані зʼявляться після перших замовлень.';
    const agg = {};
    okO.forEach((o) => o.lines.forEach((l) => { const k = l.name + ', ' + l.vol; agg[k] = (agg[k] || 0) + l.qty; }));
    const topItems = Object.keys(agg).sort((a, b) => agg[b] - agg[a]).slice(0, 8).map((k) => ({ t: k, s: agg[k] + ' шт' }));
    const topNote = topItems.length ? '' : 'Тут будуть найпопулярніші позиції.';
    const cnt = (f) => String(okO.filter(f).length);
    const stCash = cnt((o) => o.pay !== 'card'), stCard = cnt((o) => o.pay === 'card'), stDel = cnt((o) => o.mode !== 'pickup'), stPick = cnt((o) => o.mode === 'pickup');

    const setMods = (fn) => this.setState({ draft: { ...this.state.draft, mods: fn((this.state.draft.mods || []).map((x) => ({ ...x }))) } });
    const modRows = (s.draft.mods || []).map((m, i) => ({
      n: m.n, p: m.p, on: m.on,
      onN: (e) => setMods((a) => { a[i].n = e.target.value; return a; }),
      onP: (e) => setMods((a) => { a[i].p = e.target.value; return a; }),
      toggle: () => setMods((a) => { a[i].on = !a[i].on; return a; }),
      remove: () => setMods((a) => a.filter((x, j) => j !== i))
    }));
    const cur = D.prods.find((p) => p.i === s.editId) || { n: '', p: 0, w: 0 };
    const PRESETS = [['beer', '0,5 · 1 · 1,5 · 2 · 3 л'], ['snack', '50 · 100 · 150 · 200 г + своя вага'], ['piece', '1 шт']];
    const badges = [['', 'Без бейджа'], ['new', 'Новинка'], ['hit', 'Хіт продажу']].map((u) => ({ label: u[1], cls: (s.draft.badge || '') === u[0] ? 'on' : '', active: (s.draft.badge || '') === u[0], pick: () => this.setState({ draft: { ...this.state.draft, badge: u[0] } }) }));
    const presets = PRESETS.map((u) => ({ label: u[1], cls: s.preset === u[0] ? 'on' : '', active: s.preset === u[0], pick: () => this.setState({ preset: u[0] }) }));
    const dset = (k) => (e) => this.setState({ draft: { ...this.state.draft, [k]: e.target.value } });
    const sset = (k) => (e) => this.setState({ site: { ...this.state.site, [k]: e.target.value } });

    return {
      tabs, cats, found, metrics,
      taraList: ['0.5', '1', '1.5', '2', '3'].map((v) => ({ id: 'tr' + v.replace('.', '_'), label: v.replace('.', ',') + ' л', value: s.tara[v], on: (e) => this.setState({ tara: { ...this.state.tara, [v]: e.target.value } }) })),
      isBanners: s.tab === 'banners',
      banners: s.banners.map((b, i) => ({
        n: i + 1, on: b.on, title: b.title, sub: b.sub, img: b.img, hasImg: !!b.img,
        upLabel: b.img ? 'Замінити фото' : 'Завантажити фото',
        pickFile: () => { const el = document.getElementById('bf' + (i + 1)); if (el) el.click(); },
        onFile: (e) => { const f = e.target.files && e.target.files[0]; this.uploadImage(i, f); e.target.value = ''; },
        toggle: () => this.upB(i, { on: !this.state.banners[i].on }),
        onTitle: (e) => this.upB(i, { title: e.target.value }),
        onSub: (e) => this.upB(i, { sub: e.target.value }),
        remove: () => this.setState({ banners: this.state.banners.filter((x, j) => j !== i) }),
        kinds: [['', 'Без лейбла'], ['Новинка', 'Новинка'], ['Акція', 'Акція'], ['Новини', 'Новини']].map((k) => ({ label: k[1], cls: (b.kind || '') === k[0] ? 'on' : '', active: (b.kind || '') === k[0], pick: () => this.upB(i, { kind: k[0] }) }))
      })),
      addBanner: () => this.setState({ banners: this.state.banners.concat([{ img: '', kind: '', title: '', sub: '', on: true }]) }),
      saveBanners: () => {
        fetch('/api/admin/banners', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(this.state.banners) })
          .then((r) => (r.ok ? showToast('Банери збережено') : Promise.reject()))
          .catch(() => showToast('Не вдалося зберегти'));
      },
      noBanners: s.bLoaded && s.banners.length === 0,
      hasSearch: q !== '', noSearch: q === '', noFound: q !== '' && found.length === 0,
      q: s.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      isProducts: s.tab === 'products', isOrders: s.tab === 'orders', isStats: s.tab === 'stats', isSite: s.tab === 'site',
      periods,
      orderCards, noOrders, ordersMsg, stCount, stRev, stAvg, stCancel, bars, barsTitle, barsNote, topItems, topNote, stCash, stCard, stDel, stPick,
      site: s.site,
      onHours: sset('hours'), onZone: sset('zone'), onPrice: sset('price'), onMin: sset('min'), onPhone: sset('phone'), onAddr: sset('addr'), onIg: sset('ig'), onTt: sset('tt'), onTh: sset('th'), onMaps: sset('maps'),
      tgOn: s.tgOn, onTg: () => this.setState({ tgOn: !this.state.tgOn }),
      saveSite: () => this.saveAll(),
      drCls: s.drOpen ? 'open' : '',
      closeEdit: () => this.setState({ drOpen: false }),
      ed: {
        title: 'Редагування товару',
        img: s.draft.img || '', hasImg: !!s.draft.img,
        mOn: !!s.draft.mOn,
        name: s.draft.name || '', price: s.draft.price || '', desc: s.draft.desc || '',
        str: s.draft.str || '', den: s.draft.den || '', prod: s.draft.prod || '',
        posterPrice: cur.p === 0 ? '—' : fmt(cur.p),
        unitHint: cur.w ? 'за 100 г' : 'за одиницю в Poster'
      },
      onEName: dset('name'), onEPrice: dset('price'), onEDesc: dset('desc'), onEStr: dset('str'), onEDen: dset('den'), onEProd: dset('prod'),
      photoLabel: s.photoBusy ? 'Завантажую…' : (s.draft.img ? 'Замінити фото' : 'Завантажити вертикальне фото'),
      pickPhoto: () => { const el = document.getElementById('pf'); if (el) el.click(); },
      onPhoto: (e) => { const f = e.target.files && e.target.files[0]; this.uploadPhoto(f); e.target.value = ''; },
      clearPhoto: () => { const id = s.editId; const draft = { ...this.state.draft, img: '' }; this.setState({ draft, edits: { ...this.state.edits, [id]: { ...draft, upre: this.presetToSave() } } }); this.saveAll(); },
      toggleM: () => this.setState({ draft: { ...this.state.draft, mOn: !this.state.draft.mOn } }),
      resetPrice: () => this.setState({ draft: { ...this.state.draft, price: String(cur.p).replace('.', ',') } }),
      syncPriceLabel: s.pSyncing ? 'Перевіряю Poster…' : 'Синхронізувати ціну з Poster',
      syncPrice: () => {
        if (this.state.pSyncing) return;
        const id = s.editId;
        this.setState({ pSyncing: true });
        fetch('/api/admin/poster-price?id=' + encodeURIComponent(id), { credentials: 'same-origin', cache: 'no-store' })
          .then((r) => (r.ok ? r.json() : Promise.reject()))
          .then((j) => {
            const price = Number(j.price);
            if (!isFinite(price) || price <= 0) throw 0;
            const draft = { ...this.state.draft, price: String(price).replace('.', ','), pp: price };
            const edits = { ...this.state.edits, [id]: { ...draft, upre: this.presetToSave(), name: (draft.name || '') === cur.n ? '' : draft.name } };
            this.setState({ draft, edits, pSyncing: false, toast: 'Ціну оновлено з Poster: ' + fmt(price) });
            this.saveAll();
            setTimeout(() => { this.setState({ toast: '' }); }, 2200);
          })
          .catch(() => {
            this.setState({ pSyncing: false, toast: 'Не вдалося отримати ціну з Poster' });
            setTimeout(() => { this.setState({ toast: '' }); }, 2200);
          });
      },
      presets,
      modRows,
      addMod: () => setMods((a) => a.concat([{ n: '', p: '', on: true }])),
      badges,
      newItems, hasNew: newItems.length > 0, siteCats, addSiteCat, scats,
      sync, syncing: s.syncing, syncCls: s.syncing ? 'spin' : '', syncLabel: s.syncing ? 'Оновлюю з Poster…' : 'Синхронізувати з Poster', hasSyncMsg: s.syncMsg !== '', syncMsg: s.syncMsg,
      saveEdit: () => {
        const edits = { ...this.state.edits, [s.editId]: { ...this.state.draft, upre: this.presetToSave(), name: (this.state.draft.name || '') === cur.n ? '' : this.state.draft.name } };
        this.setState({ edits, drOpen: false });
        this.saveAll();
      },
      dirty: !s.drOpen && this._saved !== undefined && this.snap(s) !== this._saved,
      saveAll: () => this.saveAll(),
      toastCls: s.toast ? 'show' : '',
      toastText: s.toast || ' '
    };
  }
}

return Component;
})();
dcMount(Comp,document.getElementById('root'));
</script>
</body>
</html>
